# Uploads site/ to heleo.space (cPanel) by FTP, only after a change is merged into main.
# OFF until you switch it on:
#   1. Repo Settings > Secrets and variables > Actions > Secrets: add FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
#   2. Same page > Variables: add AUTO_DEPLOY = true
# Only files this workflow uploaded are ever removed, so everything else on the server is left alone.
name: Deploy to heleo.space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    if: vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload site/ to public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./public_html/
          exclude: |
            **/.git*
            **/.git*/**
            token/**
